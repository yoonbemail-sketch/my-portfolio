<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elevator Parking Simulator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/style.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="top">
            <div class="brand">
                <h1>Elevator Parking</h1>
                <p class="lede">Compare where idle cars should wait under peak traffic.</p>
            </div>
            <div class="actions">
                <button class="btn primary" id="btn-play" type="button">Start</button>
                <button class="btn" id="btn-pause" type="button" disabled>Pause</button>
                <button class="btn" id="btn-reset" type="button">Reset</button>
                <button class="btn ghost mobile-toggle" id="mobile-toggle" type="button" aria-label="Toggle controls">Controls</button>
            </div>
        </header>

        <section class="metrics" aria-label="Metrics">
            <div class="metric">
                <span class="metric-label">Avg wait</span>
                <span class="metric-value" id="stat-avg-wait">0</span>
            </div>
            <div class="metric">
                <span class="metric-label">Max wait</span>
                <span class="metric-value" id="stat-max-wait">0</span>
            </div>
            <div class="metric metric-wide">
                <span class="metric-label">Completed</span>
                <span class="metric-value" id="stat-completed">0 / 80</span>
                <div class="progress" aria-hidden="true">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>
            <div class="metric">
                <span class="metric-label">Empty travel</span>
                <span class="metric-value" id="stat-empty">0</span>
            </div>
        </section>

        <div class="layout">
            <aside class="controls" id="sim-controls">
                <div class="field">
                    <label for="strategy-select">Parking strategy</label>
                    <select id="strategy-select">
                        <option value="stay">Stay — last floor</option>
                        <option value="lobby">Lobby — return to 1</option>
                        <option value="mid">Mid — building center</option>
                        <option value="spread">Spread — even homes</option>
                        <option value="demand">Demand — hot floors</option>
                    </select>
                </div>
                <div class="field">
                    <label for="peak-select">Peak mode</label>
                    <select id="peak-select">
                        <option value="mixed">Mixed</option>
                        <option value="up">Up-peak</option>
                        <option value="down">Down-peak</option>
                        <option value="lunch">Lunch</option>
                    </select>
                </div>
                <div class="field">
                    <label for="floors-range">Floors <span id="floors-val">20</span></label>
                    <input type="range" id="floors-range" min="8" max="40" value="20">
                </div>
                <div class="field">
                    <label for="elevators-range">Elevators <span id="elevators-val">4</span></label>
                    <input type="range" id="elevators-range" min="1" max="8" value="4">
                </div>
                <div class="field">
                    <label for="capacity-range">Capacity <span id="capacity-val">8</span></label>
                    <input type="range" id="capacity-range" min="4" max="16" value="8">
                </div>
                <div class="field">
                    <label for="arrival-range">Arrival rate <span id="arrival-val">15%</span></label>
                    <input type="range" id="arrival-range" min="5" max="40" value="15">
                </div>
                <div class="field">
                    <label for="target-range">Target passengers <span id="target-val">80</span></label>
                    <input type="range" id="target-range" min="20" max="200" value="80" step="10">
                </div>
                <div class="field">
                    <label for="sim-speed">Speed <span id="sim-speed-val">10 TPS</span></label>
                    <input type="range" id="sim-speed" min="1" max="40" value="10">
                </div>
            </aside>

            <main class="stage">
                <div class="building-shell">
                    <div class="building" id="building"></div>
                </div>
                <ul class="legend">
                    <li><i class="swatch waiting"></i>Waiting</li>
                    <li><i class="swatch idle"></i>Idle</li>
                    <li><i class="swatch serving"></i>Serving</li>
                    <li><i class="swatch parking"></i>Parking</li>
                    <li><i class="swatch doors"></i>Doors</li>
                </ul>
            </main>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
